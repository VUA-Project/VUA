[package]
name = "vua-unity-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "Unity Bridge adapter and the material production pipeline (intake, staging, execution, documents)."
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tar = "0.4"
vua-orchestrator = { path = "../orchestrator" }
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
jsonschema = "0.52.1"
vua-project-manager = { path = "../project-manager" }

# Its own fake Unity: the binary decides its role before any test harness parses arguments.
[[test]]
name = "unity_stop"
harness = false
