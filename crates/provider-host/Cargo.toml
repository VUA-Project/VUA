[package]
name = "vua-provider-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "Supervised provider process host: composition root serving the versioned application contract."
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "vua-orchestrator-provider"
path = "src/bin/vua-orchestrator-provider.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
vua-acquisition = { path = "../acquisition" }
vua-bdl-store = { path = "../bdl-store" }
vua-orchestrator = { path = "../orchestrator" }
vua-project-manager = { path = "../project-manager" }
vua-unity-bridge = { path = "../unity-bridge" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
zip = { version = "4.6", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
jsonschema = "0.52.1"
# Test-only: auxiliary observation-side rows (tombstones) are written
# through a second connection, mirroring the bdl-store consumer tests.
rusqlite = { version = "=0.40.1", features = ["bundled"] }
scraper = "0.27.0"
