[package]
name = "vua-project-manager"
version = "0.1.0"
edition = "2021"
publish = false
description = "Project and environment adapters: concrete VPM backends, project mutation lock, environment-manager detection."
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# N1: bind user confirmation to installer bytes; already used by the core planner.
sha2 = "0.11.0"
# N1 Editor acquisition: compare Unity's published MD5; SHA-256 records local bytes.
# Owned by the Editor adapter; remove when the upstream manifest replaces MD5.
md-5 = "=0.10.6"
# A4 repo subscription face (proposal 026): url parsing for
# `add_remote_repo` — the vrc-get-vpm Settings API takes a parsed
# `url::Url`. Same major ("2") as the library's own dependency; owner
# environment domain, removal rides the adapter if the library API ever
# stops needing it.
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "fs"] }
url = "2"
vrc-get-vpm = { version = "=0.0.16", features = ["rustls", "vrc-get-litedb", "experimental-project-management"] }
vua-orchestrator = { path = "../orchestrator" }

[target.'cfg(windows)'.dependencies]
# Desktop resource sampler: DXGI identity/capacity, D3D12 UMA classification,
# language-neutral PDH counters. MIT/Apache-2.0; remove with this adapter.
windows = { version = "=0.62.2", default-features = false, features = [
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_System_Performance",
] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage",
    # Editor identity reads (editor_verify, U10 ADR gate 1): PE version
    # resource via version.dll (GetFileVersionInfo*/VerQueryValue).
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security_Cryptography",
    # N1: obtain the verified WinTrust leaf signer, never invoke a command shell.
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    # Game-window observation (game_window): top-level window enumeration
    # and window state getters, plus the one-time DPI-awareness opt-in so
    # GetWindowRect reports physical pixels.
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Gates the two real-machine test hooks (terminate_open_and_wait_for_test,
# eac_verify_windows_signature_for_test) out of the default public surface:
# they are termination/verification primitives and must not be importable by
# a plain build. Integration tests that consume them compile only with
# `--features test-hooks`.
test-hooks = []

[dev-dependencies]
jsonschema = "0.52.1"

# BG-18 regression only: the guard test reproduces the GitHub Windows
# runner's 8.3 short-name TEMP spelling via GetShortPathNameW. Dev-only so
# the library surface and normal builds carry no extra API; remove with the
# spelling test if it is ever retired.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
