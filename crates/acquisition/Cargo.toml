[package]
name = "vua-acquisition"
version = "0.1.0"
edition = "2021"
publish = false
description = "Download and warehouse domain: artifact inspection, warehouse import and maintenance."
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
vua-bdl-store = { path = "../bdl-store" }
vua-orchestrator = { path = "../orchestrator" }
vua-unity-bridge = { path = "../unity-bridge" }

[dev-dependencies]
flate2 = "1"
jsonschema = "0.52.1"
tar = "0.4"
