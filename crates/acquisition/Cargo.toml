[package]
name = "vua-acquisition"
version = "0.1.0"
edition = "2021"
publish = false
description = "Download and warehouse domain: artifact inspection, warehouse import and maintenance."
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
pdf-extract = "=0.10.0"
regex = "1"
unicode-normalization = "0.1"
url = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time", "net", "macros"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
vua-bdl-store = { path = "../bdl-store" }
vua-orchestrator = { path = "../orchestrator" }
vua-unity-bridge = { path = "../unity-bridge" }

[dev-dependencies]
flate2 = "1"
jsonschema = "0.52.1"
tar = "0.4"
