# W11 (M3 closure) — contract schema/vector face.
#
# Scope: every Rust test that consumes a frozen schema vocabulary or fixed
# vector set under `schemas/` for real (both ends of each contract). This
# badge is the machine-readable "contract face is green" signal: when a
# schema, vector, or consumer test changes, these targeted tests run fast
# and standalone. The authoritative list below must be extended whenever a
# new contract test that reads `schemas/` lands.
name: schema-vectors

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "crates/**/tests/**"
      - "crates/*/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/schema-vectors.yml"
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: schema-vectors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vectors:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      # Contract anchor per crate (tests that read schemas/ for real):
      # - vua-acquisition:    bdl_commands_contract           (bdl-commands v0.1)
      #                       import_downloads_contract_v04   (bdl-commands v0.4)
      #                       import_contract_v03             (bdl-commands v0.3)
      #                       production_evidence_contract    (production-evidence v0.1)
      #                       recipe_selection_drafts_v01     (selection-draft v0.1 baseline)
      # - vua-bdl-store:      catalog_serving                 (bdl-queries v0.3)
      #                       downloads_list_serving          (bdl-queries v0.4)
      #                       global_default_v02              (bdl-commands v0.2)
      #                       product_downloadables           (BDL v0.3/v0.4 migrations)
      #                       library_evidence_v05            (BDL v0.5 migration baseline)
      # - vua-orchestrator:   assembly, build_record, contracts,
      #                       recipe, recipe_v03, vpm_spike_contract
      #                       production_evidence             (production-evidence consumer)
      # - vua-project-manager: environment_managers           (environment-managers v0.1)
      #                       editor_verify_wire              (editor-verify v0.1 DRAFT —
      #                        run for drift protection only; draft state does not imply freeze)
      #                       eac_probe / eac_allowlist_verify / eac_terminate (006 v0.1 x3)
      #                       import_copy                     (project-ops v0.1/v0.2)
      #                       project_inspection / project_queries / vua_identity (project-inspection v0.1/v0.2)
      #                       game_window                     (game-window-observe v0.1)
      # - vua-provider-host:  m3_vectors                      (amf-production v0.2)
      #                       provider_frame_handshake        (provider-frame-v0.1)
      #                       warehouse_commands              (bdl-commands v0.1 + v0.4 consumer)
      #                       catalog_queries                 (bdl-queries v0.3 + v0.4 consumer)
      #                       production_use_case_vectors     (production-use-case v0.2)
      #                       project_ops_wire                (project-ops v0.1/v0.2 + 013 read face)
      #                       task_snapshot_wire              (application-contract v0.1 / proposal 020)
      #                       editor_verify_wire              (editor-verify v0.1 DRAFT —
      #                        run for drift protection only; draft state does not imply freeze)
      #                       game_window_wire                (game-window-observe v0.1 wire face)
      #                       catalog_sync_wire_v01           (catalog-sync v0.1/v0.3)
      #                       product_downloadables_wire_v07  (bdl-queries v0.7)
      #                       library_download_wire_v01       (download/view/maintenance/draft baselines)
      # - vua-unity-bridge:   material_intake                 (material-intake v0.1)
      #                       bridge_v2_vectors               (unity-bridge v2 frozen)
      #                       inspection_evidence_vectors     (inspection-evidence v0.1 DRAFT —
      #                        run for drift protection only; draft state does not imply freeze)
      - name: vua-acquisition
        run: cargo test -p vua-acquisition --test bdl_commands_contract --test import_downloads_contract_v04 --test import_contract_v03 --test production_evidence_contract --test recipe_selection_drafts_v01
      - name: vua-bdl-store
        run: cargo test -p vua-bdl-store --test catalog_serving --test downloads_list_serving --test global_default_v02 --test product_downloadables --test library_evidence_v05
      - name: vua-orchestrator
        run: cargo test -p vua-orchestrator --test assembly --test build_record --test contracts --test recipe --test recipe_v03 --test production_evidence --test vpm_spike_contract
      - name: vua-project-manager
        run: cargo test -p vua-project-manager --test environment_managers --test editor_verify_wire --test eac_probe --test eac_allowlist_verify --test eac_terminate --test import_copy --test project_inspection --test project_queries --test vua_identity --test game_window
      - name: vua-provider-host
        run: cargo test -p vua-provider-host --test m3_vectors --test provider_frame_handshake --test warehouse_commands --test catalog_queries --test production_use_case_vectors --test project_ops_wire --test task_snapshot_wire --test editor_verify_wire --test game_window_wire --test catalog_sync_wire_v01 --test product_downloadables_wire_v07 --test library_download_wire_v01
      - name: vua-unity-bridge
        run: cargo test -p vua-unity-bridge --test material_intake --test bridge_v2_vectors --test inspection_evidence_vectors
