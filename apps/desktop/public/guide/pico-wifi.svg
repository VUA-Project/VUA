<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <!-- 自制示意图:PICO 4 Pro 与 PC 经同一路由器 Wi-Fi 串流(无文字,标签由
       HTML/i18n 提供)。配色取双主题均可读的中性色,不绑定任一主题 Token。 -->
  <!-- 路由器:机身 + 天线 -->
  <g fill="none" stroke="#8f8aa8" stroke-width="4">
    <rect x="128" y="64" width="64" height="24" rx="8"/>
    <line x1="144" y1="64" x2="144" y2="44"/>
    <line x1="176" y1="64" x2="176" y2="44"/>
  </g>
  <!-- 高亮:无线信号弧 -->
  <g fill="none" stroke="#6557d2" stroke-width="4" stroke-linecap="round">
    <path d="M 148 32 Q 160 24 172 32"/>
    <path d="M 140 22 Q 160 10 180 22"/>
  </g>
  <!-- PC 显示器(左下) -->
  <g fill="none" stroke="#8f8aa8" stroke-width="4">
    <rect x="28" y="108" width="80" height="52" rx="8"/>
    <line x1="68" y1="160" x2="68" y2="172"/>
    <line x1="52" y1="172" x2="84" y2="172"/>
  </g>
  <rect x="38" y="118" width="60" height="32" rx="4" fill="#8f8aa8" opacity="0.35"/>
  <!-- PICO 头显(右下) -->
  <g fill="none" stroke="#8f8aa8" stroke-width="4">
    <path d="M 232 116 Q 260 102 288 116"/>
    <rect x="212" y="116" width="76" height="44" rx="14"/>
  </g>
  <g fill="#6557d2">
    <circle cx="234" cy="138" r="8"/>
    <circle cx="264" cy="138" r="8"/>
  </g>
  <!-- 无线链路(路由器 → 两台设备) -->
  <g fill="none" stroke="#6557d2" stroke-width="3" stroke-dasharray="5 6" stroke-linecap="round">
    <path d="M 140 88 Q 100 96 80 108"/>
    <path d="M 180 88 Q 220 96 240 116"/>
  </g>
</svg>
